name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build executable
        run: .\build.ps1
        shell: pwsh

      - name: Calculate SHA-256
        run: Get-FileHash dist\RoClick.exe -Algorithm SHA256 | Format-List | Out-File dist\RoClick.sha256.txt
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoClick-Windows
          path: |
            dist/RoClick.exe
            dist/RoClick.sha256.txt
