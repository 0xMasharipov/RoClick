name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/native-windows*']
  pull_request:

permissions:
  contents: read

jobs:
  portable-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S native -B build/native && cmake --build build/native && ctest --test-dir build/native --output-on-failure

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Inno Setup
        run: choco install innosetup --version=6.4.3 --allow-downgrade --yes --no-progress
      - name: Build native tests, release app and offline installer
        shell: pwsh
        run: ./build.ps1 -SkipInstall
      - name: Installer smoke test and screenshots
        shell: pwsh
        run: ./scripts/smoke-install.ps1
      - name: Upload prepared artifacts (no release publishing)
        uses: actions/upload-artifact@v4
        with:
          name: RoClick-Windows-x64
          path: |
            dist/RoClick-Setup.exe
            dist/SHA256SUMS.txt
            dist/roclick_benchmark.exe
            artifacts/screenshots/*.png
            artifacts/smoke-install.json
          if-no-files-found: error
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RoClick-build-diagnostics
          path: |
            build/windows.binlog
            build/native/Testing/Temporary/LastTest.log
            artifacts/*.log
