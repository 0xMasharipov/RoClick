name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/native-windows*']
  pull_request:

permissions:
  contents: read

jobs:
  portable-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S native -B build/native && cmake --build build/native && ctest --test-dir build/native --output-on-failure

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: windows-rnw-0.80.6-${{ hashFiles('windows/**/packages.lock.json') }}
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $file = Join-Path $env:RUNNER_TEMP 'innosetup-6.4.3.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_4_3/innosetup-6.4.3.exe' -OutFile $file
          if ((Get-FileHash $file -Algorithm SHA256).Hash -ne 'f3c42116542c4cc57263c5ba6c4feabfc49fe771f2f98a79d2f7628b8762723b') { throw 'Inno Setup checksum mismatch' }
          $process = Start-Process $file -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed: $($process.ExitCode)" }
      - name: Build native tests, release app and offline installer
        id: build
        shell: pwsh
        run: ./build.ps1 -SkipInstall
      - name: Installer smoke test and screenshots
        shell: pwsh
        run: ./scripts/smoke-install.ps1
      - name: Upload prepared artifacts (no release publishing)
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: RoClick-Windows-x64
          path: |
            dist/RoClick-Setup.exe
            dist/SHA256SUMS.txt
            dist/roclick_benchmark.exe
            artifacts/screenshots/*.png
            artifacts/smoke-install.json
          if-no-files-found: error
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RoClick-build-diagnostics
          path: |
            build/windows.binlog
            windows/RoClick/packages.lock.json
            build/native/Testing/Temporary/LastTest.log
            artifacts/*.log
            artifacts/screenshots/*.png
